name: Build Android app

on:
  push:
    branches: [main]
    paths: ['app/**', 'source/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Also upload to Google Play? (needs PLAY_SERVICE_ACCOUNT_JSON secret and a first manual upload)'
        type: choice
        options: [no, internal, closed-testing, production]
        default: 'no'
      version_name:
        description: 'Version name shown in the store, e.g. 1.0, 1.1'
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Build app from source (applies source/config.js) and sync Capacitor
        run: |
          npm ci
          python3 ../source/build.py
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing key found - release bundle will be signed."
          else
            echo "::warning::No KEYSTORE_BASE64 secret - the .aab will NOT be signed and cannot be uploaded to Play."
          fi

      - name: Build test APK and Play Store bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          mkdir -p ../../out
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/JyotishSaathi-test-v${VERSION_CODE}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/JyotishSaathi-v${VERSION_CODE}.aab

      - name: Save files (Actions > this run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JyotishSaathi-build-${{ github.run_number }}
          path: out/*

      - name: Publish test APK as a download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          body: |
            Install **JyotishSaathi-test-v${{ github.run_number }}.apk** on an Android phone to test.
            Upload **JyotishSaathi-v${{ github.run_number }}.aab** to Google Play Console.
          files: out/*

      - name: Upload to Google Play
        if: ${{ inputs.upload_to_play && inputs.upload_to_play != 'no' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jyotishsaathi.app
          releaseFiles: out/JyotishSaathi-v${{ github.run_number }}.aab
          track: ${{ inputs.upload_to_play == 'closed-testing' && 'alpha' || inputs.upload_to_play }}
          status: completed
