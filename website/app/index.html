<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7B1E2B">
<title>Jyotish Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>:root{--bg:#FBF4E9;--card:#fff;--line:#EEDFC8;--ink:#2B1A12;--mut:#7A6453;--mar:#7B1E2B;--saf:#D9651A;--saf2:#F08A24;--gold:#C8962E;--good:#2E7D4F;--bad:#C0392B;--mid:#C98A12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kv,.ptitle{font-family:'Tiro Devanagari Hindi','Mukta',serif;color:var(--mar);font-weight:400;margin:0}
h2{font-size:1.45rem;line-height:1.25}h3{font-size:1.2rem;margin-bottom:.5rem}
p{margin:.4rem 0}
button,input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.55rem;padding:.6rem 1rem;background:rgba(251,244,233,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top b{font-family:'Tiro Devanagari Hindi',serif;font-weight:400;font-size:1.25rem;color:var(--mar);flex:1}
.top .logo{width:36px;height:36px}
.langbtn{border:1.5px solid var(--mar);color:var(--mar);background:#fff;border-radius:999px;padding:.25rem .9rem;font-weight:600;min-height:42px}
.main{padding:1rem 1rem 7rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.1rem;margin:0 0 1rem;box-shadow:0 2px 10px rgba(123,30,43,.05)}
.muted{color:var(--mut)}.small{font-size:.85rem}.center{text-align:center}
.lead{font-size:1.12rem;line-height:1.55}
.ptitle{font-size:1.55rem;margin:.2rem 0 1rem}
.hero{background:linear-gradient(160deg,#fff 0%,#FFF1DD 100%)}
.hero-top{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}
.badge{background:var(--mar);color:#FBE7C6;border-radius:14px;padding:.35rem .8rem;text-align:center;font-size:.8rem;line-height:1.2;flex-shrink:0}
.badge b{display:block;font-size:1.15rem;color:#fff;font-weight:600}
.score{display:flex;align-items:center;gap:.7rem;margin:.9rem 0 .4rem;flex-wrap:wrap}
.score-l{font-weight:700;font-size:1.2rem}
.s1 .score-l,.s2 .score-l{color:var(--bad)}.s3 .score-l{color:var(--mid)}.s4 .score-l,.s5 .score-l{color:var(--good)}
.stars{color:var(--saf2);letter-spacing:2px;font-size:1.15rem;white-space:nowrap}.stars .off{color:#E8D9C3}.stars.big{font-size:1.7rem}
.tara{background:#FBF1E2;border-radius:12px;padding:.55rem .8rem;font-size:.95rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.row3{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:56px;padding:.6rem 1rem;border-radius:16px;border:0;font-weight:600;font-size:1.02rem;text-decoration:none;cursor:pointer;text-align:center;line-height:1.25}
.btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn.block{display:flex;width:100%;margin:0 0 1rem}
.btn.primary{background:var(--saf);color:#fff;box-shadow:0 4px 12px rgba(217,101,26,.3)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--mar)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.link{background:none;color:var(--mar);min-height:44px;padding:.2rem 0}
.btn.sm{min-height:44px;padding:.3rem .9rem;font-size:.92rem;border-radius:12px}
.btn.danger{color:var(--bad)}.danger-bg{background:var(--bad)!important}
.seg{display:flex;background:#F1E4D0;border-radius:16px;padding:4px;margin:0 0 1rem;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:12px;min-height:50px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--mar);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg.sm button{min-height:44px;font-size:.95rem}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:.8rem .9rem}
.tile.warn{background:#FFF6F3}
.tl{font-size:.85rem;color:var(--mut);margin-bottom:.15rem}
.tv{font-size:1.18rem;font-weight:700;display:flex;align-items:center;gap:.45rem;line-height:1.25}
.tv.num{font-size:2rem;color:var(--saf)}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #D9C7AE;flex-shrink:0}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:.65rem;align-items:flex-start;padding:.55rem 0;border-top:1px dashed var(--line);font-size:1.05rem}
.list li:first-child{border-top:0}
.list svg{width:26px;height:26px;flex-shrink:0;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;border-radius:50%;padding:4px}
.list.good svg{stroke:#fff;background:var(--good)}.list.bad svg{stroke:#fff;background:var(--bad)}
.area,.time,.prow{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.6rem 0;border-top:1px solid #F4EADB}
.area:first-of-type,.prow:first-child{border-top:0}
.time span,.prow span{color:var(--mut)}
.time b,.prow b{text-align:right}
.prow small{display:block;font-weight:400;color:var(--mut);font-size:.8rem}
.time.bad b{color:var(--bad)}.time.good b{color:var(--good)}
.mantra{text-align:center;background:linear-gradient(160deg,#7B1E2B,#5A1520);color:#FBE7C6;border:0}
.mantra h3{color:#F3C46B}.mantra .muted{color:#E7C9A5}
.mtext{font-family:'Tiro Devanagari Hindi',serif;font-size:1.7rem;color:#fff;margin:.3rem 0}
.premium{background:linear-gradient(150deg,#FFF8E6,#FCEBC4);border-color:#EED69A}
.premium .ph{display:flex;gap:.7rem;align-items:center;margin-bottom:.4rem}
.premium .ph svg{width:40px;height:40px;fill:var(--gold);stroke:#9C7016;stroke-width:1}
.premium .ph b{font-size:1.2rem;color:#7A5410}
.premium ul{margin:.3rem 0 .9rem;padding-left:1.2rem}.premium li{margin:.2rem 0}
.premium .btn{margin:0}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.6rem}
.kv{font-size:1.25rem;line-height:1.2}.kv small{display:block;font-family:'Mukta';font-size:.75rem;color:var(--mut)}
.chart{width:100%;height:auto;display:block;margin:.2rem 0 .4rem}
.chart .cbg{fill:#FFFBF4;stroke:var(--mar);stroke-width:3}
.chart .cl{fill:none;stroke:var(--mar);stroke-width:2}
.chart .pl{font-size:17px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;font-family:'Mukta'}
.chart .asc{fill:var(--saf)}
.chart .sn{font-size:13px;fill:#A8865F;text-anchor:middle;dominant-baseline:middle}
.dasha-now{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;background:#FBF1E2;border-radius:14px;padding:.7rem .9rem;margin-bottom:.5rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:.4rem}
.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:.35rem .25rem;border-bottom:1.5px solid var(--line)}
.tbl td{padding:.5rem .25rem;border-bottom:1px solid #F4EADB;vertical-align:top}
.tbl tr.cur td{background:#FFF1DD;font-weight:700}
.r{color:var(--bad);font-size:.75rem;font-weight:700}
.pill{display:inline-block;padding:.3rem .9rem;border-radius:999px;font-weight:700;margin:.2rem 0 .4rem}
.pill.good{background:#E3F3E9;color:var(--good)}.pill.bad{background:#FBE5E2;color:var(--bad)}.pill.sm{font-size:.85rem;padding:.45rem .8rem}
.tgood{color:var(--good)}.tbad{color:var(--bad)}
.chips{display:flex;gap:.5rem;overflow-x:auto;margin:0 -1rem 1rem;padding:0 1rem .2rem}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.4rem 1.1rem;min-height:46px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--mar);color:#fff;border-color:var(--mar)}
.ring{width:150px;height:150px;border-radius:50%;margin:.3rem auto .6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid}
.ring b{font-size:2.6rem;line-height:1}.ring span{font-size:.85rem;color:var(--mut)}
.ring.good{border-color:#9ED3B2;color:var(--good)}.ring.mid{border-color:#F2D18A;color:var(--mid)}.ring.bad{border-color:#F2B3AB;color:var(--bad)}
.fl{display:block;font-weight:600;color:var(--mar);margin-bottom:1rem;font-size:.98rem}
.fl input,.fl select{display:block;width:100%;margin-top:.35rem;min-height:56px;border:1.5px solid #DCC9AE;border-radius:14px;padding:.55rem .85rem;background:#fff;font-size:1.05rem;color:var(--ink);font-weight:400}
.fl input:focus,.fl select:focus{outline:3px solid #F5C08F;border-color:var(--saf)}
.fl input:disabled{background:#F3EDE4;color:#A99}
.fl .seg{margin-top:.35rem}
.cb{display:flex;gap:.6rem;align-items:center;margin:-.4rem 0 .4rem;font-size:1rem;min-height:44px}
.cb input{width:26px;height:26px;accent-color:var(--saf)}
.err{background:#FBE5E2;color:var(--bad);border-radius:12px;padding:.6rem .8rem;margin-bottom:1rem;font-weight:600}
.member{display:flex;gap:.85rem;align-items:flex-start}
.member.on{border:2px solid var(--saf)}
.av{width:52px;height:52px;border-radius:50%;background:var(--mar);color:#FBE7C6;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;flex-shrink:0}
.mi{flex:1;min-width:0}.mi b{font-size:1.12rem}
.palm{width:190px;max-width:60%;height:auto;margin:.4rem auto;display:block}
.palm .hand *{fill:#F6DCC3;stroke:#B98258;stroke-width:2}
.pline{fill:none;stroke:#C9A27E;stroke-width:3;stroke-linecap:round}
.pline.hl{stroke:var(--saf);stroke-width:6}
.pshape{fill:none;stroke:var(--saf);stroke-width:4;stroke-dasharray:8 6}
.palmimg{width:100%;max-height:300px;object-fit:cover;border-radius:16px}
.palmpair{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:center}
.palmimg.sm{max-height:200px}
.palmpair .palm{max-width:100%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.steps{display:flex;gap:.4rem;justify-content:center;margin:.2rem 0 .3rem}
.steps span{width:34px;height:8px;border-radius:4px;background:#EADBC5}.steps span.on{background:var(--saf)}
.opts{display:grid;gap:.7rem;margin-bottom:1rem}
.opt{background:#fff;border:2px solid var(--line);border-radius:18px;min-height:64px;padding:.7rem 1rem;font-weight:600;font-size:1.08rem;text-align:left;cursor:pointer;color:var(--ink)}
.opt:active{border-color:var(--saf);background:#FFF4E8}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem}
.icbtn{width:56px;height:56px;border-radius:16px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icbtn svg{width:26px;height:26px;fill:none;stroke:var(--mar);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sday{display:flex;gap:.9rem;align-items:center;padding:.55rem 0;border-top:1px solid #F4EADB}.sday:first-of-type{border-top:0}
.sdate{width:54px;height:54px;border-radius:14px;background:#FBF1E2;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--mar);flex-shrink:0}
.sdate b{font-size:1.3rem}.sdate span{font-size:.72rem}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding:.3rem .2rem .45rem;z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:62px;justify-content:center;color:var(--mut);font-size:.8rem;font-weight:600;cursor:pointer;border-radius:14px}
.tabs svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--saf);background:#FFF3E6}
.disc{text-align:center;font-size:.78rem;color:var(--mut);margin:1.5rem .5rem 0}
.welcome{text-align:center;padding:2.5rem .5rem}
.welcome .logo{width:110px;height:110px;margin-bottom:1rem}
.welcome h1{font-size:2.3rem;line-height:1.15;margin-bottom:.8rem}.welcome h1 span{font-size:1.3rem;color:var(--saf)}
.langbig{display:grid;gap:.9rem;margin-top:.8rem}
.langbig button{min-height:72px;border-radius:20px;border:0;background:var(--saf);color:#fff;font-size:1.5rem;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(217,101,26,.3)}
.langbig button+button{background:#fff;color:var(--mar);border:2px solid var(--mar);box-shadow:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2B1A12;color:#fff;padding:.65rem 1.2rem;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(30,15,10,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:1.2rem}
.mbox{background:#fff;border-radius:22px;padding:1.3rem;width:100%;max-width:400px}
@media (min-width:600px){.main{padding-top:1.4rem}}
.ptitle.sec{margin:1.6rem 0 .1rem}.secsub{margin:0 0 .9rem}
.life .lh{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.3rem}
.life .lh h3{margin:0;flex:1;min-width:9rem}
.life .li{font-size:1.5rem;width:44px;height:44px;border-radius:14px;background:#FBF1E2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fact{background:#FBF1E2;border-radius:12px;padding:.55rem .8rem;margin:.5rem 0}
.fact span{display:block;font-size:.82rem;color:var(--mut)}
.period{display:flex;gap:.6rem;align-items:flex-start;border:1.5px dashed #E9C99C;border-radius:12px;padding:.55rem .8rem;margin-top:.6rem;background:#FFFBF4}
.period small{color:var(--mut)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin-bottom:.4rem}
.lgrid b{display:flex;align-items:center;gap:.4rem;font-size:1.08rem}.lgrid .full{grid-column:1/-1}
.swatch.sm{width:20px;height:20px}
.yoga{padding:.55rem 0;border-top:1px solid #F4EADB}.yoga:first-of-type{border-top:0}.yoga b{color:var(--mar)}.yoga p{margin:.15rem 0 0}

/* ================= 3D THEME ================= */
:root{--depth:#B44F10;--card-hi:rgba(255,255,255,.9)}
body{background:
  radial-gradient(1200px 500px at 50% -180px,#8E2633 0%,#6B1824 38%,transparent 39%),
  radial-gradient(circle at 20% 30%,rgba(240,138,36,.10),transparent 40%),
  linear-gradient(180deg,#F7EBDA 0%,#FBF4E9 40%,#F6E7D2 100%);background-attachment:fixed}
.top{background:linear-gradient(180deg,#8E2633,#6B1824);border-bottom:0;box-shadow:0 6px 18px rgba(80,15,25,.35),inset 0 -1px 0 rgba(255,255,255,.08)}
.top b{color:#FCE3B5;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.top .logo{filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));animation:spin3d 14s linear infinite}
.langbtn{background:linear-gradient(180deg,#FFE7B8,#F3C46B);color:#5A1520;border:0;box-shadow:0 3px 0 #B4842A,0 6px 10px rgba(0,0,0,.25)}
.langbtn:active{transform:translateY(3px);box-shadow:0 0 0 #B4842A}
.ptitle{color:var(--mar);text-shadow:0 1px 0 #fff,0 2px 3px rgba(123,30,43,.15)}
.card{border:1px solid rgba(220,196,160,.7);background:linear-gradient(180deg,#FFFFFF 0%,#FFFBF5 100%);
  box-shadow:inset 0 1px 0 var(--card-hi),0 1px 1px rgba(90,40,10,.06),0 6px 12px rgba(90,40,10,.08),0 16px 28px -10px rgba(90,40,10,.22);border-radius:22px}
.hero{background:linear-gradient(155deg,#FFFFFF 0%,#FFF1DC 55%,#FFE2BC 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,210,122,.45),rgba(240,138,36,0) 70%);pointer-events:none}
.badge{width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;
  background:radial-gradient(circle at 32% 28%,#C24A5A 0%,#8E2633 45%,#4E0F19 100%);
  box-shadow:inset -6px -8px 14px rgba(0,0,0,.35),inset 5px 5px 10px rgba(255,255,255,.18),0 10px 18px rgba(78,15,25,.35)}
.badge b{font-size:1.05rem;text-shadow:0 2px 2px rgba(0,0,0,.35)}
.stars{text-shadow:0 1px 0 #B4581A,0 2px 4px rgba(240,138,36,.45)}
.stars .off{text-shadow:none}
.btn{transition:transform .08s,box-shadow .08s}
.btn.primary{background:linear-gradient(180deg,#F28C35 0%,#D9651A 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 var(--depth),0 10px 18px rgba(180,79,16,.35)}
.btn.primary:active{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 var(--depth),0 3px 6px rgba(180,79,16,.3)}
.btn.wa{background:linear-gradient(180deg,#2BB866,#1C8A4A);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 5px 0 #13663A,0 10px 16px rgba(19,102,58,.3)}
.btn.wa:active{transform:translateY(5px);box-shadow:0 0 0 #13663A}
.btn.ghost{background:linear-gradient(180deg,#fff,#FBF3E7);box-shadow:inset 0 1px 0 #fff,0 4px 0 #E3CFB2,0 8px 14px rgba(90,40,10,.12)}
.btn.ghost:active{transform:translateY(4px);box-shadow:0 0 0 #E3CFB2}
.btn.gold{background:linear-gradient(180deg,#E3B356,#C8962E);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #946A18,0 10px 16px rgba(148,106,24,.3)}
.btn.gold:active{transform:translateY(5px);box-shadow:0 0 0 #946A18}
.btn.link{box-shadow:none}
.seg{background:linear-gradient(180deg,#E9D7BC,#F3E5D0);box-shadow:inset 0 3px 6px rgba(90,40,10,.18),inset 0 -1px 0 #fff}
.seg button.on{background:linear-gradient(180deg,#fff,#FFF6EA);box-shadow:0 1px 0 #fff inset,0 3px 0 #E0C9A6,0 6px 10px rgba(90,40,10,.15)}
.tile{background:linear-gradient(160deg,#FFFFFF,#FFF5E8);border:1px solid rgba(220,196,160,.7);box-shadow:inset 0 1px 0 #fff,0 4px 0 #EAD6B8,0 10px 16px rgba(90,40,10,.12);transform:perspective(600px) rotateX(2deg)}
.tile.warn{background:linear-gradient(160deg,#FFFFFF,#FFEDE8)}
.tv.num{text-shadow:0 2px 0 #F9D3AF,0 4px 8px rgba(217,101,26,.3)}
.swatch{box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),inset 2px 2px 4px rgba(255,255,255,.6),0 3px 5px rgba(0,0,0,.2);border:0}
.list svg{box-shadow:0 3px 6px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
.list.good svg{background:radial-gradient(circle at 35% 30%,#4CB27A,#23673F)}.list.bad svg{background:radial-gradient(circle at 35% 30%,#E26A5C,#9B2A1F)}
.mantra{background:radial-gradient(circle at 50% -20%,#A8364A 0%,#7B1E2B 45%,#4A0F18 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 16px 30px -8px rgba(78,15,25,.55)}
.mtext{text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 18px rgba(243,196,107,.45)}
.premium{background:linear-gradient(150deg,#FFF9EA 0%,#FBE3AE 100%);box-shadow:inset 0 1px 0 #fff,0 16px 28px -10px rgba(148,106,24,.45)}
.premium .ph svg{filter:drop-shadow(0 3px 3px rgba(148,106,24,.45))}
.chart{filter:drop-shadow(0 10px 14px rgba(78,15,25,.22))}
.chart .cbg{fill:url(#cg)}
.life .li,.sdate,.av{box-shadow:inset 0 1px 0 #fff,0 3px 0 #E7D0AE,0 6px 10px rgba(90,40,10,.15)}
.av{background:radial-gradient(circle at 32% 28%,#C24A5A,#7B1E2B 55%,#4E0F19);box-shadow:inset -4px -5px 10px rgba(0,0,0,.3),0 6px 12px rgba(78,15,25,.3)}

/* ================= MOTION ================= */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateX(-70deg) translateY(10px)}to{opacity:1;transform:perspective(600px) rotateX(2deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-60deg)}70%{transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes glowPulse{from{text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 10px rgba(243,196,107,.25)}to{text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 26px rgba(243,196,107,.8)}}
@keyframes draw{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.15)}65%{transform:translateY(1px)}100%{transform:none}}
@keyframes sparkle{from{background-position:0 0,0 0}to{background-position:220px 60px,-160px 40px}}
@keyframes ringFill{from{stroke-dashoffset:var(--c0)}}
@keyframes lineGlow{0%,100%{stroke:#D9651A;filter:none}50%{stroke:#FFB067;filter:drop-shadow(0 0 4px #F08A24)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
#app.anim .main>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#app.anim .main>*:nth-child(2){animation-delay:.06s}#app.anim .main>*:nth-child(3){animation-delay:.12s}#app.anim .main>*:nth-child(4){animation-delay:.18s}
#app.anim .main>*:nth-child(5){animation-delay:.24s}#app.anim .main>*:nth-child(6){animation-delay:.3s}#app.anim .main>*:nth-child(7){animation-delay:.36s}
#app.anim .main>*:nth-child(8){animation-delay:.42s}#app.anim .main>*:nth-child(n+9){animation-delay:.48s}
#app.anim .tile{animation:flipIn .7s cubic-bezier(.2,.8,.2,1) both}
#app.anim .tile:nth-child(2){animation-delay:.1s}#app.anim .tile:nth-child(3){animation-delay:.2s}#app.anim .tile:nth-child(4){animation-delay:.3s}
.stars i{font-style:normal;display:inline-block}.stars i.o{color:#E8D9C3;text-shadow:none}
#app.anim .stars i{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
#app.anim .stars i:nth-child(2){animation-delay:.08s}#app.anim .stars i:nth-child(3){animation-delay:.16s}#app.anim .stars i:nth-child(4){animation-delay:.24s}#app.anim .stars i:nth-child(5){animation-delay:.32s}
#app.anim .hero .stars i{animation-delay:calc(.35s + var(--d,0s))}
.badge{animation:bob 5s ease-in-out infinite}
.mtext{animation:glowPulse 2.8s ease-in-out infinite alternate}
.chart.draw .cl{stroke-dasharray:2400;animation:draw 1.6s ease-out both .15s}
.chart.draw text{animation:fadeIn .6s both 1.1s}
.pline.hl{animation:lineGlow 1.8s ease-in-out infinite}
#app.anim .tabs .on svg{animation:bounce .55s ease}
.top{overflow:hidden}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 20px 15px,#FCE3B5,transparent),radial-gradient(1px 1px at 90px 35px,#fff,transparent);
  background-size:220px 60px,160px 40px;animation:sparkle 18s linear infinite}
.top>*{position:relative}
.btn.primary,.btn.gold,.langbig button:first-child{position:relative;overflow:hidden}
.btn.primary::after,.btn.gold::after,.langbig button:first-child::after{content:"";position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
.ring{border:0;position:relative}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:#F1E4D0;stroke-width:10}

.ring.good .rp{stroke:#2E9A5E}.ring.mid .rp{stroke:#E0A12E}.ring.bad .rp{stroke:#D9534F}
.ring b,.ring span{position:relative}
.welcome{position:relative}
.welcome h1,.welcome .lead,.welcome .tl,.langbig{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.welcome .lead{animation-delay:.15s}.welcome .tl{animation-delay:.25s}.langbig{animation-delay:.35s}
.opt{animation:rise .5s both}.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.modal{animation:fadeIn .2s both}.mbox{animation:rise .3s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    : 'Write every text value in simple, warm ENGLISH that a 50-70 year old Indian reader understands. Add the Hindi name of each line in brackets once, e.g. "Life line (Jeevan Rekha)".';
  return `You are a highly experienced Indian palmist (Hast Rekha Shastra) and Vedic astrologer.
Image 1 is the person's LEFT hand. Image 2 is the person's RIGHT hand. The person writes with the ${dom} hand, so the ${dom} hand is the active hand (what they have made of life, and the present and future) and the ${other} hand shows inborn potential.
Photos may be mirrored or rotated: identify the thumb side first, then orient each palm before reading it.

STEP 1 – Examine each photo slowly, region by region (thumb base, centre, below each finger, the percussion edge, the wrist), before you conclude anything. Look carefully at what is really visible: palm shape and size relative to the fingers, finger lengths, thumb, the major lines (life, head, heart, fate), minor lines (sun/Apollo, marriage/relationship, health/Mercury, travel, bracelets), the mounts (Jupiter, Saturn, Sun, Mercury, Venus, Moon, Mars), and marks (stars, crosses, islands, chains, breaks, forks, branches, triangles, squares). Describe each line by its real features: where it starts and ends, length, depth, curve, breaks, branches, islands, chains. If a line is faint, unclear or not visible, say so honestly – never invent features. Base every meaning ONLY on features you actually describe. Compare left and right. Use the person's real age (in the data) when you place timing on the life and fate lines, and never put a future event at an age they have already passed.
If a photo does not clearly show an open palm (blurred, too dark, back of hand, cropped), set the matching "valid" flag to false and explain in "issue" how to retake it (one short sentence). If both are invalid, other fields may be empty.

STEP 2 – Combine the palm with this person's Kundli (birth chart) below. Where palm and Kundli agree, say so – it strengthens the prediction; where they differ, give a balanced view. Use the dasha periods given for timing.

KUNDLI DATA (JSON):
${JSON.stringify(kundli)}

RULES:
- ${L}

- No guarantees about money, legal or medical matters.

      text: 'दोहा\nश्रीगुरु चरन सरोज रज, निज मनु मुकुरु सुधारि।\nबरनउँ रघुबर बिमल जसु, जो दायकु फल चारि॥\nबुद्धिहीन तनु जानिके, सुमिरौं पवन-कुमार।\nबल बुद्धि बिद्या देहु मोहिं, हरहु कलेस बिकार॥\n\nचौपाई\nजय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर॥\nराम दूत अतुलित बल धामा। अंजनि-पुत्र पवनसुत नामा॥\nमहाबीर बिक्रम बजरंगी। कुमति निवार सुमति के संगी॥\nकंचन बरन बिराज सुबेसा। कानन कुंडल कुंचित केसा॥\nहाथ बज्र औ ध्वजा बिराजै। काँधे मूँज जनेऊ साजै॥\nसंकर सुवन केसरीनंदन। तेज प्रताप महा जग बंदन॥\nबिद्यावान गुनी अति चातुर। राम काज करिबे को आतुर॥\nप्रभु चरित्र सुनिबे को रसिया। राम लखन सीता मन बसिया॥\nसूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥\nभीम रूप धरि असुर सँहारे। रामचंद्र के काज सँवारे॥\nलाय सजीवन लखन जियाये। श्रीरघुबीर हरषि उर लाये॥\nरघुपति कीन्ही बहुत बड़ाई। तुम मम प्रिय भरतहि सम भाई॥\nसहस बदन तुम्हरो जस गावैं। अस कहि श्रीपति कंठ लगावैं॥\nसनकादिक ब्रह्मादि मुनीसा। नारद सारद सहित अहीसा॥\nजम कुबेर दिगपाल जहाँ ते। कबि कोबिद कहि सके कहाँ ते॥\nतुम उपकार सुग्रीवहिं कीन्हा। राम मिलाय राज पद दीन्हा॥\nतुम्हरो मंत्र बिभीषन माना। लंकेस्वर भए सब जग जाना॥\nजुग सहस्र जोजन पर भानू। लील्यो ताहि मधुर फल जानू॥\nप्रभु मुद्रिका मेलि मुख माहीं। जलधि लाँघि गये अचरज नाहीं॥\nदुर्गम काज जगत के जेते। सुगम अनुग्रह तुम्हरे तेते॥\nराम दुआरे तुम रखवारे। होत न आज्ञा बिनु पैसारे॥\nसब सुख लहै तुम्हारी सरना। तुम रच्छक काहू को डर ना॥\nआपन तेज सम्हारो आपै। तीनों लोक हाँक तें काँपै॥\nभूत पिसाच निकट नहिं आवै। महाबीर जब नाम सुनावै॥\nनासै रोग हरै सब पीरा। जपत निरंतर हनुमत बीरा॥\nसंकट तें हनुमान छुड़ावै। मन क्रम बचन ध्यान जो लावै॥\nसब पर राम तपस्वी राजा। तिन के काज सकल तुम साजा॥\nऔर मनोरथ जो कोई लावै। सोइ अमित जीवन फल पावै॥\nचारों जुग परताप तुम्हारा। है परसिद्ध जगत उजियारा॥\nसाधु संत के तुम रखवारे। असुर निकंदन राम दुलारे॥\nअष्ट सिद्धि नौ निधि के दाता। अस बर दीन जानकी माता॥\nराम रसायन तुम्हरे पासा। सदा रहो रघुपति के दासा॥\nतुम्हरे भजन राम को पावै। जनम जनम के दुख बिसरावै॥\nअंत काल रघुबर पुर जाई। जहाँ जन्म हरि-भक्त कहाई॥\nऔर देवता चित्त न धरई। हनुमत सेइ सर्ब सुख करई॥\nसंकट कटै मिटै सब पीरा। जो सु M('aarti-shiv', ['shiv', 'aarti'], ['Om Jai Shiv Omkara (Aarti)', 'ॐ जय शिव ओंकारा (आरती)'],
'ॐ जय शिव ओंकारा, स्वामी जय शिव ओंकारा।\nब्रह्मा विष्णु सदाशिव, अर्द्धांगी धारा॥\n\nएकानन चतुरानन पंचानन राजे।\nहंसासन गरुड़ासन वृषवाहन साजे॥\n\nदो भुज चार चतुर्भुज दसभुज अति सोहे।\nत्रिगुण रूप निरखते त्रिभुवन जन मोहे॥\n\nअक्षमाला वनमाला मुण्डमाला धारी।\nचंदन मृगमद सोहे भाले शशिधारी॥\n\nश्वेताम्बर पीताम्बर बाघम्बर अंगे।\nसनकादिक गरुड़ादिक भूतादिक संगे॥\n\nकर के मध्य कमण्डलु चक्र त्रिशूलधारी।\nसुखकारी दुखहारी जगपालन कारी॥\n\nब्रह्मा विष्णु सदाशिव जानत अविवेका।\nप्रणवाक्षर में शोभित ये तीनों एका॥\n\nत्रिगुणस्वामी जी की आरती जो कोई नर गावे।\nकहत शिवानन्द स्वामी मनवांछित फल पावे॥',
['The best-known aarti of Lord Shiva, praising Him as Omkara, in whom Brahma, Vishnu and Sadashiv are one.', 'भगवान शिव की सबसे प्रसिद्ध आरती, जिसमें उन्हें ओंकार कहा गया है, जिनमें ब्रह्मा, विष्णु और सदाशिव एक हैं।'],
['Mondays, Sawan and Mahashivratri', 'सोमवार, सावन और महाशिवरात्रि']);
M('aarti-ambe', ['devi', 'aarti'], ['Jai Ambe Gauri (Durga Aarti)', 'जय अम्बे गौरी (दुर्गा आरती)'],
'जय अम्बे गौरी, मैया जय श्यामा गौरी।\nतुमको निशदिन ध्यावत, हरि ब्रह्मा शिवरी॥\n\nमांग सिंदूर विराजत, टीको मृगमद को।\nउज्ज्वल से दोउ नैना, चंद्रवदन नीको॥\n\nकनक समान कलेवर, रक्ताम्बर राजै।\nरक्तपुष्प गल माला, कंठन पर साजै॥\n\nकेहरि वाहन राजत, खड्ग खप्पर धारी।\nसुर-नर-मुनिजन सेवत, तिनके दुखहारी॥\n\nकानन कुण्डल शोभित, नासाग्रे मोती।\nकोटिक चंद्र दिवाकर, सम राजत ज्योती॥\n\nशुंभ-निशुंभ बिदारे, महिषासुर घाती।\nधूम्र विलोचन नैना, निशदिन मदमाती॥\n\nचण्ड-मुण्ड संहारे, शोणित बीज हरे।\nमधु-कैटभ दोउ मारे, सुर भयहीन करे॥\n\nब्रह्माणी रूद्राणी, तुम कमला रानी।\nआगम निगम बखानी, तुम शिव पटरानी॥\n\nचौंसठ योगिनी गावत, नृत्य करत भैरों।\nबाजत ताल मृदंगा, अरु बाजत डमरू॥\n\nतुम ही जग की माता, तुम ही हो भरता।\nभक्तन की दुख हरता, सुख संपति करता॥\n\nभुजा चार अति शोभित, वर मुद्रा धारी।\nमनवांछित फल पावत, सेवत नर नारी॥\n\nकंचन थाल विराजत, अगर कपूर बाती।\nश्रीमालकेतु में राजत, कोटि रतन ज्योती॥\n\nश्री अम्बेजी की आरती, जो कोई नर गावे।\nकहत शिवानंद स्वामी, सुख-संपति पावे॥',
['The main aarti of Maa Durga (Ambe), recalling how she destroyed the demons and protects her devotees.', 'माँ दुर्गा (अम्बे) की मुख्य आरती, जिसमें असुरों के नाश और भक्तों की रक्षा का गुणगान है।'],
['Navratri, Fridays and every evening', 'नवरात्रि, शुक्रवार और हर शाम']);
M('aarti-kunj', ['vishnu', 'aarti'], ['Aarti Kunj Bihari Ki (Krishna)', 'आरती कुंजबिहारी की (कृष्ण)'],
'आरती कुंजबिहारी की, श्री गिरधर कृष्ण मुरारी की॥\n\nगले में बैजंती माला, बजावै मुरली मधुर बाला।\nश्रवण में कुण्डल झलकाला, नंद के आनंद नंदलाला।\nगगन सम अंग कांति काली, राधिका चमक रही आली।\nलतन में ठाढ़े बनमाली, भ्रमर सी अलक, कस्तूरी तिलक,\nचंद्र सी झलक, ललित छवि श्यामा प्यारी की॥ श्री गिरधर कृष्ण मुरारी की॥\n\nकनकमय मोर मुकुट बिलसै, देवता दरसन को तरसैं।\nगगन सों सुमन रासि बरसै, बजे मुरचंग, मधुर मिरदंग,\nग्वालिन संग, अतुल रति गोप कुमारी की॥ श्री गिरधर कृष्ण मुरारी की॥\n\nजहां ते प्रकट भई गंगा, सकल मन हारिणि श्री गंगा।\nस्मरन ते होत मोह भंगा, बसी शिव सीस, जटा के बीच,\nहरै अघ कीच, चरन छवि श्री बनवारी की॥ श्री गिरधर कृष्ण मुरारी की॥\n\nचमकती उज्ज्वल तट रेनू, बज रही वृंदावन बेनू।\nचहुं दिसि गोपि ग्वाल धेनू, हंसत मृदु मंद, चांदनी चंद,\nकटत भव फंद, टेर सुन दीन दुखारी की॥ श्री गिरधर कृष्ण मुरारी की॥\n\nआरती कुंजबिहारी की, श्री गिरधर कृष्ण मुरारी की॥',
['The best-loved aarti of Shri Krishna of Vrindavan, describing His flute, peacock crown and beauty.', 'वृंदावन के श्रीकृष्ण की सबसे प्रिय आरती, जिसमें उनकी मुरली, मोर मुकुट और सुंदर छवि का वर्णन है।'],
['Janmashtami, Wednesdays and evening puja', 'जन्माष्टमी, बुधवार और शाम की पूजा']);
M('aarti-hanuman', ['hanuman', 'aarti'], ['Aarti Kije Hanuman Lala Ki', 'आरती कीजै हनुमान लला की'],
'आरती कीजै हनुमान लला की। दुष्ट दलन रघुनाथ कला की॥\n\nजाके बल से गिरिवर कांपे। रोग दोष जाके निकट न झांके॥\nअंजनि पुत्र महा बलदाई। संतन के प्रभु सदा सहाई॥\n\nदे बीरा रघुनाथ पठाए। लंका जारि सिया सुधि लाए॥\nलंका सो कोट समुद्र सी खाई। जात पवनसुत बार न लाई॥\n\nलंका जारि असुर संहारे। सियारामजी के काज संवारे॥\nलक्ष्मण मूर्छित पड़े सकारे। आनि संजीवन प्राण उबारे॥\n\nपैठि पाताल तोरि जम-कारे। अहिरावण की भुजा उखारे॥\nबाएं भुजा असुरदल मारे। दाहिने भुजा संतजन तारे॥\n\nसुर नर मुनि आरती उतारें। जय जय जय हनुमान उचारें॥\nकंचन थार कपूर लौ छाई। आरती करत अंजना माई॥\n\nजो हनुमानजी की आरती गावे। बसि बैकुण्ठ परम पद पावे॥',
['The aarti of Hanuman ji, recalling how he burnt Lanka, brought the Sanjeevani herb and protects the saints.', 'हनुमान जी की आरती, जिसमें लंका दहन, संजीवनी लाने और संतों की रक्षा का वर्णन है।'],
['Tuesdays and Saturdays, after Hanuman Chalisa', 'मंगलवार और शनिवार, हनुमान चालीसा के बाद']);
M('aarti-sukhkarta', ['ganesh', 'aarti'], ['Sukhkarta Dukhharta (Marathi Ganesh Aarti)', 'सुखकर्ता दुःखहर्ता (मराठी गणेश आरती)'],
'सुखकर्ता दुःखहर्ता वार्ता विघ्नाची।\nनुरवी पुरवी प्रेम कृपा जयाची।\nसर्वांगी सुंदर उटी शेंदुराची।\nकंठी झळके माळ मुक्ताफळांची॥\n\nजय देव जय देव जय मंगलमूर्ती।\nदर्शनमात्रे मनकामना पुरती॥\n\nरत्नखचित फरा तुज गौरीकुमरा।\nचंदनाची उटी कुंकुमकेशरा।\nहिरे जडित मुकुट शोभतो बरा।\nरुणझुणती नूपुरे चरणी घागरिया॥ जय देव जय देव…\n\nलंबोदर पीतांबर फणिवरबंधना।\nसरळ सोंड वक्रतुंड त्रिनयना।\nदास रामाचा वाट पाहे सदना।\nसंकटी पावावे निर्वाणी रक्षावे सुरवरवंदना॥ जय देव जय देव…',
['The famous Marathi aarti of Ganpati by Sant Samarth Ramdas (17th century), sung during Ganeshotsav.', 'संत समर्थ रामदास (17वीं सदी) की प्रसिद्ध मराठी गणपति आरती, जो गणेशोत्सव में गाई जाती है।'],
['Ganesh Chaturthi and daily Ganpati puja', 'गणेश चतुर्थी और रोज़ की गणपति पूजा']);
M('ram-kripalu', ['vishnu', 'stuti'], ['Shri Ramchandra Kripalu (Ram Stuti)', 'श्री रामचन्द्र कृपालु (राम स्तुति)'],
'श्रीरामचन्द्र कृपालु भजु मन हरण भवभय दारुणं।\nनवकंज लोचन कंज मुख कर कंज पद कंजारुणं॥\n\nकंदर्प अगणित अमित छवि नवनील नीरद सुंदरं।\nपट पीत मानहुँ तड़ित रुचि शुचि नौमि जनक सुतावरं॥\n\nभजु दीनबंधु दिनेश दानव दैत्य वंश निकंदनं।\nरघुनंद आनंद कंद कोशल चंद दशरथ नंदनं॥\n\nसिर मुकुट कुंडल तिलक चारु उदारु अंग विभूषणं।\nआजानु भुज शर चाप धर संग्राम जित खरदूषणं॥\n\nइति वदति तुलसीदास शंकर शेष मुनि मन रंजनं।\nमम हृदय कंज निवास कुरु कामादि खल दल गंजनं॥',
['Goswami Tulsidas\'s hymn (Vinay Patrika): O mind, worship kind Shri Ram, who removes the fear of this world. May He live in the lotus of my heart.', 'गोस्वामी तुलसीदास की स्तुति (विनय पत्रिका): हे मन, संसार का भय हरने वाले कृपालु श्रीराम को भजो। वे मेरे हृदय-कमल में निवास करें।'],
['Ram Navami, Thursdays and evening', 'राम नवमी, गुरुवार और शाम']);
M('aarti-jain-adi', ['jain', 'aarti'], ['Jay Jay Aarti Adi Jinanda (Jain Aarti)', 'जय जय आरती आदि जिणंदा (जैन आरती)'],
'जय जय आरती आदि जिणंदा,\nनाभिराया मरुदेवी को नंदा॥\n\nपहली आरती पूजा कीजे,\nनरभव पामीने लाहो लीजे॥\n\nदूसरी आरती दीनदयाला,\nधूलेवा नगर में जग अजवाला॥\n\nतीसरी आरती त्रिभुवन देवा,\nसुरनर इंद्र करे तोरी सेवा॥\n\nचौथी आरती चउगति चूरे,\nमनवांछित फल शिवसुख पूरे॥\n\nपांचमी आरती पुण्य उपाया,\nमूलचंदे रिषभ गुण गाया॥',
['The Shwetambar Jain aarti of Bhagwan Adinath (Rishabhdev), son of King Nabhi and Mata Marudevi, by the poet Mulchand.', 'भगवान आदिनाथ (ऋषभदेव), राजा नाभि और माता मरुदेवी के पुत्र, की श्वेतांबर जैन आरती, कवि मूलचंद द्वारा।'],
['Evening aarti in the derasar, followed by Mangal Divo', 'शाम को देरासर में आरती, उसके बाद मंगल दीवो']);
M('jain-mangal-divo', ['jain', 'aarti'], ['Mangal Divo (Jain)', 'मंगल दीवो (जैन)'],
'दीवो रे दीवो प्रभु मंगलिक दीवो,\nआरती उतारण बहु चिरंजीवो॥\n\nसोहामणुं घेर पर्व दिवाळी,\nअंबर खेले अमरा बाळी॥\n\nदीपाल भणे एणे कुळ अजवाळी,\nभावे भगते विघन निवारी॥\n\nदीपाल भणे एणे ए कलिकाले,\nआरती उतारी राजा कुमारपाळे॥\n\nअम घेर मंगलिक, तुम घेर मंगलिक,\nमंगलिक चतुर्विध संघने होजो॥',
['The auspicious lamp sung right after the Jain aarti: may there be blessings in our home, your home and the whole fourfold Jain Sangh.', 'जैन आरती के तुरंत बाद गाया जाने वाला मंगल दीवो: हमारे घर, आपके घर और पूरे चतुर्विध संघ में मंगल हो।'],
['Right after the evening aarti', 'शाम की आरती के ठीक बाद']);
M('aarti-panch-parmeshthi', ['jain', 'aarti'], ['Panch Parmeshthi Aarti (Digambar)', 'पंच परमेष्ठी आरती (दिगंबर)'],
'इह विधि मंगल आरती कीजे,\nपंच परमपद भज सुख लीजे॥\n\nपहली आरती श्री जिनराजा,\nभव दधि पार उतार जिहाजा॥\n\nदूसरी आरती सिद्धन केरी,\nसुमरन करत मिटे भव फेरी॥\n\nतीजी आरती सूर मुनिंदा,\nजनम मरन दुःख दूर करिंदा॥\n\nचौथी आरती श्री उवझाया,\nदर्शन देखत पाप पलाया॥\n\nपाँचमी आरती साधु तिहारी,\nकुमति विनाशन शिव अधिकारी॥\n\nछट्ठी ग्यारह प्रतिमा धारी,\nश्रावक वंदूं आनंदकारी॥\n\nसातवीं आरती श्री जिनवाणी,\n‘द्यानत’ सुरग मुकति सुखदानी॥',
['Digambar Jain aarti by Kavi Dyanatrai, offering a lamp to the five supreme beings: Arihant, Siddha, Acharya, Upadhyaya and Sadhu, and to Jinvani.', 'कवि द्यानतराय की दिगंबर जैन आरती, जिसमें पाँच परमेष्ठी – अरिहंत, सिद्ध, आचार्य, उपाध्याय, साधु – और जिनवाणी की आरती है।'],
['Evening aarti in the Jain mandir', 'शाम को जैन मंदिर में आरती']);

M('shantakaram', ['vishnu', 'stuti'], ['Shantakaram Bhujagashayanam', 'शान्ताकारं भुजगशयनं'],
'शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं\nविश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम्।\nलक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यं\nवन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्॥',
['I bow to Lord Vishnu: peaceful, resting on the serpent, with a lotus at His navel, support of the universe, dark as a rain cloud, beloved of Lakshmi, who removes the fear of worldly life.', 'शांत स्वरूप, शेषनाग पर शयन करने वाले, नाभि में कमल वाले, जगत के आधार, मेघ के समान वर्ण वाले, लक्ष्मीपति, संसार का भय हरने वाले भगवान विष्णु को प्रणाम।'],
['Thursday, Ekadashi and before Vishnu puja', 'गुरुवार, एकादशी और विष्णु पूजा से पहले'],
'Shantakaram bhujagashayanam padmanabham suresham\nvishvadharam gaganasadrisham meghavarnam shubhangam\nlakshmikantam kamalanayanam yogibhir dhyanagamyam\nvande vishnum bhavabhayaharam sarvalokaikanatham');
M('guru-brahma', ['daily', 'stuti'], ['Gurur Brahma (Guru Vandana)', 'गुरुर्ब्रह्मा (गुरु वंदना)'],
'गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः।\nगुरुः साक्षात् परब्रह्म तस्मै श्री गुरवे नमः॥',
['The Guru is Brahma, Vishnu and Maheshwar; the Guru is the Supreme itself. Salutations to that Guru.', 'गुरु ही ब्रह्मा, विष्णु और महेश्वर हैं; गुरु साक्षात परब्रह्म हैं। ऐसे श्री गुरु को नमस्कार।'],
['Morning, Guru Purnima and before study', 'सुबह, गुरु पूर्णिमा और पढ़ाई से पहले'], 'Gurur brahma gurur vishnuh gurur devo maheshvarah\nguruh sakshat para-brahma tasmai shri gurave namah');
M('tvameva', ['daily', 'stuti'], ['Tvameva Mata Cha Pita', 'त्वमेव माता च पिता'],
'त्वमेव माता च पिता त्वमेव,\nत्वमेव बन्धुश्च सखा त्वमेव।\nत्वमेव विद्या द्रविणं त्वमेव,\nत्वमेव सर्वं मम देव देव॥',
['O God, You alone are my mother and father, my relative and friend, my knowledge and wealth; You are my everything.', 'हे प्रभु, आप ही मेरी माता, पिता, बंधु और सखा हैं; आप ही विद्या और धन हैं; आप ही मेरे सब कुछ हैं।'],
['End of puja, anytime', 'पूजा के अंत में, कभी भी'], 'Tvameva mata cha pita tvameva\ntvameva bandhushcha sakha tvameva\ntvameva vidya dravinam tvameva\ntvameva sarvam mama deva deva');
M('purnamadah', ['peace'], ['Om Purnamadah (Shanti Path)', 'ॐ पूर्णमदः (शांति पाठ)'],
'ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते।\nपूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते॥\nॐ शान्तिः शान्तिः शान्तिः॥',
['That is whole, this is whole; from the whole comes the whole. Take the whole from the whole and the whole remains. (Ishavasya Upanishad)', 'वह पूर्ण है, यह पूर्ण है; पूर्ण से पूर्ण उत्पन्न होता है। पूर्ण में से पूर्ण निकालने पर भी पूर्ण ही शेष रहता है। (ईशावास्य उपनिषद)'],
['Start or end of any puja', 'किसी भी पूजा के आरंभ या अंत में'], 'Om purnamadah purnamidam purnat purnam udachyate\npurnasya purnam adaya purnam evavashishyate\nOm shantih shantih shantih');
M('brahmarpanam', ['daily', 'peace'], ['Brahmarpanam (Bhojan Mantra)', 'ब्रह्मार्पणं (भोजन मंत्र)'],
'ब्रह्मार्पणं ब्रह्म हविर्ब्रह्माग्नौ ब्रह्मणा हुतम्।\nब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना॥',
['From the Bhagavad Gita (4.24): the offering, the food and the one who eats are all the Divine. Said before meals.', 'भगवद गीता (4.24) से: अर्पण, भोजन और खाने वाला – सब ब्रह्म ही है। भोजन से पहले बोला जाता है।'],
['Before every meal', 'हर भोजन से पहले'], 'Brahmarpanam brahma havir brahmagnau brahmana hutam\nbrahmaiva tena gantavyam brahma-karma-samadhina');
M('yada-yada', ['vishnu', 'stuti'], ['Yada Yada Hi Dharmasya (Gita)', 'यदा यदा हि धर्मस्य (गीता)'],
'यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।\nअभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम्॥\nपरित्राणाय साधूनां विनाशाय च दुष्कृताम्।\nधर्मसंस्थापनार्थाय सम्भवामि युगे युगे॥',
['Shri Krishna in the Gita (4.7-8): whenever dharma declines, I come, age after age, to protect the good and restore dharma.', 'गीता (4.7-8) में श्रीकृष्ण: जब-जब धर्म की हानि होती है, मैं सज्जनों की रक्षा और धर्म की स्थापना के लिए युग-युग में प्रकट होता हूँ।'],
['Gita path, Janmashtami', 'गीता पाठ, जन्माष्टमी'], 'Yada yada hi dharmasya glanir bhavati bharata\nabhyutthanam adharmasya tadatmanam srijamyaham\nparitranaya sadhunam vinashaya cha dushkritam\ndharma-samsthapanarthaya sambhavami yuge yuge');
M('krishnaya', ['vishnu'], ['Krishnaya Vasudevaya', 'कृष्णाय वासुदेवाय'],
'कृष्णाय वासुदेवाय हरये परमात्मने।\nप्रणतः क्लेशनाशाय गोविन्दाय नमो नमः॥',
['Salutations again and again to Krishna, Vasudeva, Hari, the Supreme Soul, Govinda, who removes the troubles of those who bow to Him.', 'कृष्ण, वासुदेव, हरि, परमात्मा, गोविंद को बार-बार नमन, जो शरणागत के कष्ट दूर करते हैं।'],
['To remove troubles; 11 or 108 times', 'कष्ट दूर करने के लिए; 11 या 108 बार'], 'Krishnaya vasudevaya haraye paramatmane\npranatah klesha-nashaya govindaya namo namah');
M('ram-rameti', ['vishnu'], ['Shri Ram Ram Rameti', 'श्रीराम राम रामेति'],
'श्रीराम राम रामेति रमे रामे मनोरमे।\nसहस्रनाम तत्तुल्यं रामनाम वरानने॥',
['Shiva tells Parvati: saying "Ram" three times equals reciting the thousand names of Vishnu.', 'शिवजी पार्वती जी से कहते हैं: तीन बार "राम" कहना विष्णु सहस्रनाम के बराबर है।'],
['When there is no time for a full path', 'जब पूरा पाठ करने का समय न हो'], 'Shri rama rama rameti rame rame manorame\nsahasranama tat-tulyam rama-nama varanane');
M('manojavam', ['hanuman', 'stuti'], ['Manojavam Marutatulyavegam', 'मनोजवं मारुततुल्यवेगं'],
'मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम्।\nवातात्मजं वानरयूथमुख्यं श्रीरामदूतं शरणं प्रपद्ये॥',
['I take refuge in Hanuman, swift as the mind and the wind, master of his senses, wisest of the wise, messenger of Shri Ram.', 'मन और वायु के समान वेगवान, जितेंद्रिय, बुद्धिमानों में श्रेष्ठ, श्रीराम के दूत हनुमान जी की शरण लेता हूँ।'],
['Before travel and on Tuesdays', 'यात्रा से पहले और मंगलवार को'], 'Manojavam maruta-tulya-vegam jitendriyam buddhimatam varishtham\nvatatmajam vanara-yutha-mukhyam shri-rama-dutam sharanam prapadye');
M('ganesh-gayatri', ['ganesh'], ['Ganesh Gayatri', 'गणेश गायत्री'],
'ॐ एकदन्ताय विद्महे वक्रतुण्डाय धीमहि।\nतन्नो दन्ती प्रचोदयात्॥',
['We know the one-tusked Lord and meditate on the curved-trunk Lord; may Ganesha inspire us.', 'हम एकदंत को जानते हैं, वक्रतुंड का ध्यान करते हैं; गणेश जी हमें प्रेरित करें।'],
['108 times on Wednesday and Chaturthi', 'बुधवार और चतुर्थी को 108 बार'], 'Om ekadantaya vidmahe vakratundaya dhimahi\ntanno danti prachodayat');
M('shiv-panchakshar', ['shiv', 'stuti'], ['Nagendraharaya (Shiv Panchakshar)', 'नागेन्द्रहाराय (शिव पंचाक्षर)'],
'नागेन्द्रहाराय त्रिलोचनाय\nभस्माङ्गरागाय महेश्वराय।\nनित्याय शुद्धाय दिगम्बराय\nतस्मै नकाराय नमः शिवाय॥',
['First verse of Adi Shankaracharya\'s Shiva Panchakshara Stotra: to Shiva who wears the serpent king, three-eyed, smeared with ash, eternal and pure – salutations to "Na".', 'आदि शंकराचार्य के शिव पंचाक्षर स्तोत्र का पहला श्लोक: नागराज को धारण करने वाले, त्रिनेत्र, भस्म लगाए, नित्य और शुद्ध शिव को – "न" अक्षर को नमन।'],
['Mondays and Sawan', 'सोमवार और सावन'], 'Nagendra-haraya trilochanaya\nbhasmanga-ragaya maheshvaraya\nnityaya shuddhaya digambaraya\ntasmai na-karaya namah shivaya');
M('kshama', ['shiv', 'daily'], ['Karacharana Kritam (Forgiveness Prayer)', 'करचरणकृतं (क्षमा प्रार्थना)'],
'करचरणकृतं वाक्कायजं कर्मजं वा\nश्रवणनयनजं वा मानसं वापराधम्।\nविहितमविहितं वा सर्वमेतत्क्षमस्व\nजय जय करुणाब्धे श्रीमहादेव शम्भो॥',
['O Mahadev, ocean of compassion, forgive every mistake I made with hands, feet, speech, body, ears, eyes or mind, knowingly or unknowingly.', 'हे करुणा के सागर महादेव, हाथ, पैर, वाणी, शरीर, कान, आँख या मन से जाने-अनजाने हुई मेरी सब भूलें क्षमा करें।'],
['At night before sleeping', 'रात को सोने से पहले'], 'Kara-charana-kritam vak-kayajam karmajam va\nshravana-nayanajam va manasam vaparadham\nvihitam avihitam va sarvam etat kshamasva\njaya jaya karunabdhe shri mahadeva shambho');
M('sarva-mangala', ['devi', 'stuti'], ['Sarva Mangala Mangalye', 'सर्वमङ्गलमाङ्गल्ये'],
'सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके।\nशरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते॥',
['From the Durga Saptashati: salutations to Narayani, Gauri, the most auspicious one, who fulfils every good aim and gives refuge.', 'दुर्गा सप्तशती से: सब मंगलों में मंगलमयी, सब कार्य सिद्ध करने वाली, शरण देने वाली गौरी नारायणी को नमस्कार।'],
['Navratri and before any good work', 'नवरात्रि और हर शुभ कार्य से पहले'], 'Sarva-mangala-mangalye shive sarvartha-sadhike\nsharanye tryambake gauri narayani namostu te');
M('navarna', ['devi'], ['Navarna Mantra (Chamunda)', 'नवार्ण मंत्र (चामुंडा)'], 'ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे॥',
['The nine-syllable mantra of Maa Durga (Chamunda), for Saraswati, Lakshmi and Kali\'s blessings together.', 'माँ दुर्गा (चामुंडा) का नौ अक्षरों का मंत्र – सरस्वती, लक्ष्मी और काली की एक साथ कृपा के लिए।'],
['108 times in Navratri', 'नवरात्रि में 108 बार'], 'Om aim hreem kleem chamundayai vichche');
M('sarva-badha', ['devi'], ['Sarva Badha Vinirmukto', 'सर्वाबाधाविनिर्मुक्तो'],
'सर्वाबाधाविनिर्मुक्तो धनधान्यसुतान्वितः।\nमनुष्यो मत्प्रसादेन भविष्यति न संशयः॥',
['The Devi\'s promise in the Durga Saptashati: by My grace a person becomes free of all obstacles and is blessed with wealth, food and children.', 'दुर्गा सप्तशती में देवी का वचन: मेरी कृपा से मनुष्य सब बाधाओं से मुक्त होकर धन, धान्य और संतान से युक्त होगा।'],
['For removing obstacles; 108 times', 'बाधा दूर करने के लिए; 108 बार'], 'Sarva-badha-vinirmukto dhana-dhanya-sutanvitah\nmanushyo mat-prasadena bhavishyati na samshayah');
M('kali-mantra', ['devi'], ['Kali Mantra', 'काली मंत्र'], 'ॐ क्रीं कालिकायै नमः॥',
['Salutations to Maa Kali, for protection and courage.', 'रक्षा और साहस के लिए माँ काली को नमन।'], ['Saturday or Amavasya, 108 times', 'शनिवार या अमावस्या, 108 बार'], 'Om kreem kalikayai namah');
M('lakshmi-ashtak', ['devi', 'stuti'], ['Namastestu Mahamaye (Mahalakshmi)', 'नमस्तेऽस्तु महामाये (महालक्ष्मी)'],
'नमस्तेऽस्तु महामाये श्रीपीठे सुरपूजिते।\nशङ्खचक्रगदाहस्ते महालक्ष्मि नमोऽस्तु ते॥',
['First verse of the Mahalakshmi Ashtakam: salutations to Mahalakshmi, the great Maya, worshipped by the gods, holding conch, discus and mace.', 'महालक्ष्मी अष्टकम का पहला श्लोक: देवताओं द्वारा पूजित, शंख-चक्र-गदा धारण करने वाली महामाया महालक्ष्मी को नमस्कार।'],
['Fridays and Diwali', 'शुक्रवार और दीपावली'], 'Namastestu mahamaye shri-pithe sura-pujite\nshankha-chakra-gada-haste mahalakshmi namostu te');
M('kuber', ['devi'], ['Kuber Mantra', 'कुबेर मंत्र'], 'ॐ यक्षाय कुबेराय वैश्रवणाय धनधान्याधिपतये\nधनधान्यसमृद्धिं मे देहि दापय स्वाहा॥',
['Prayer to Kuber, lord of wealth, for prosperity in the home.', 'धन के स्वामी कुबेर से घर में समृद्धि की प्रार्थना।'], ['Dhanteras, Diwali and Fridays', 'धनतेरस, दीपावली और शुक्रवार'], 'Om yakshaya kuberaya vaishravanaya dhana-dhanyadhipataye\ndhana-dhanya-samriddhim me dehi dapaya svaha');
M('navgraha-shanti', ['graha', 'peace'], ['Navgraha Shanti Shloka', 'नवग्रह शांति श्लोक'],
'ब्रह्मा मुरारिस्त्रिपुरान्तकारी\nभानुः शशी भूमिसुतो बुधश्च।\nगुरुश्च शुक्रः शनिराहुकेतवः\nसर्वे ग्रहाः शान्तिकरा भवन्तु॥',
['May Brahma, Vishnu, Shiva and the nine planets – Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Rahu and Ketu – all bring peace.', 'ब्रह्मा, विष्णु, शिव और नौ ग्रह – सूर्य, चंद्र, मंगल, बुध, गुरु, शुक्र, शनि, राहु, केतु – सब शांति देने वाले हों।'],
['Daily, for peace from all planets', 'रोज़, सभी ग्रहों की शांति के लिए'], 'Brahma murari-stripurantakari\nbhanuh shashi bhumisuto budhashcha\ngurushcha shukrah shani-rahu-ketavah\nsarve grahah shantikara bhavantu');
M('surya-japakusuma', ['graha', 'daily'], ['Japakusuma (Surya Mantra)', 'जपाकुसुम (सूर्य मंत्र)'],
'जपाकुसुमसंकाशं काश्यपेयं महाद्युतिम्।\nतमोऽरिं सर्वपापघ्नं प्रणतोऽस्मि दिवाकरम्॥\n\nॐ घृणि सूर्याय नमः॥',
['I bow to the Sun, red like the hibiscus, son of Kashyapa, enemy of darkness, who removes all sins.', 'गुड़हल के फूल जैसे लाल, कश्यप के पुत्र, अंधकार के शत्रु, सब पाप हरने वाले सूर्यदेव को प्रणाम।'],
['Morning, while offering water (arghya) to the Sun', 'सुबह, सूर्य को जल (अर्घ्य) देते समय'], 'Japa-kusuma-sankasham kashyapeyam mahadyutim\ntamorim sarva-papaghnam pranatosmi divakaram\nOm ghrini suryaya namah');
M('shani-nilanjana', ['graha'], ['Nilanjana Samabhasam (Shani)', 'नीलांजनसमाभासं (शनि)'],
'नीलांजनसमाभासं रविपुत्रं यमाग्रजम्।\nछायामार्तण्डसंभूतं तं नमामि शनैश्चरम्॥',
['I bow to Shani Dev, dark like blue collyrium, son of the Sun and Chhaya, elder brother of Yama.', 'नीले अंजन जैसे, सूर्य और छाया के पुत्र, यमराज के बड़े भाई शनिदेव को नमन।'],
['Saturdays, especially in Sade Sati', 'शनिवार, विशेषकर साढ़े साती में'], 'Nilanjana-samabhasam ravi-putram yamagrajam\nchhaya-martanda-sambhutam tam namami shanaishcharam');
M('sai-mantra', ['daily'], ['Om Sai Ram', 'ॐ साईं राम'], 'ॐ साईं नमो नमः, श्री साईं नमो नमः।\nजय जय साईं नमो नमः, सद्गुरु साईं नमो नमः॥',
['Simple chant to Shirdi Sai Baba: salutations again and again to Sai, the true Guru.', 'शिरडी साईं बाबा का सरल जप: सद्गुरु साईं को बार-बार नमन।'], ['Thursdays', 'गुरुवार'], 'Om sai namo namah, shri sai namo namah\njai jai sai namo namah, sadguru sai namo namah');

/* --- Jain --- */
M('chattari', ['jain', 'daily'], ['Chattari Mangalam', 'चत्तारि मंगलं'],
'चत्तारि मंगलं, अरिहंता मंगलं, सिद्धा मंगलं,\nसाहू मंगलं, केवलि पण्णत्तो धम्मो मंगलं॥\n\nचत्तारि लोगुत्तमा, अरिहंता लोगुत्तमा, सिद्धा लोगुत्तमा,\nसाहू लोगुत्तमा, केवलि पण्णत्तो धम्मो लोगुत्तमो॥\n\nचत्तारि सरणं पवज्जामि, अरिहंते सरणं पवज्जामि,\nसिद्धे सरणं पवज्जामि, साहू सरणं पवज्जामि,\nकेवलि पण्णत्तं धम्मं सरणं पवज्जामि॥',
['Four are auspicious, four are the highest in the world, and in four I take refuge: the Arihants, the Siddhas, the Sadhus and the Dharma taught by the Kevalis.', 'चार मंगल हैं, चार लोक में उत्तम हैं, चार की शरण लेता हूँ: अरिहंत, सिद्ध, साधु और केवली भगवान द्वारा कहा गया धर्म।'],
['After the Navkar Mantra, morning and before sleep', 'णमोकार मंत्र के बाद, सुबह और सोने से पहले'], 'Chattari mangalam, arihanta mangalam, siddha mangalam,\nsahu mangalam, kevali pannatto dhammo mangalam\nChattari loguttama ... Chattari saranam pavajjami ...');
M('khamemi', ['jain', 'peace'], ['Khamemi Savve Jiva (Forgiveness)', 'खामेमि सव्वे जीवा (क्षमापना)'],
'खामेमि सव्वे जीवा, सव्वे जीवा खमंतु मे।\nमित्ती मे सव्व भूएसु, वेरं मज्झ न केणइ॥\n\nमिच्छामि दुक्कडं॥',
['I forgive all living beings; may all living beings forgive me. I have friendship with all, enmity with none. "Michchhami Dukkadam" – may my faults be forgiven.', 'मैं सब जीवों को क्षमा करता हूँ, सब जीव मुझे क्षमा करें। सबसे मेरी मैत्री है, किसी से वैर नहीं। "मिच्छामि दुक्कडं" – मेरी भूलें क्षमा हों।'],
['Daily, and especially on Samvatsari / Kshamavani (Paryushan)', 'रोज़, और विशेषकर संवत्सरी / क्षमावाणी (पर्युषण) पर'], 'Khamemi savve jiva, savve jiva khamantu me\nmitti me savva bhuesu, veram majjha na kenai\nMichchhami dukkadam');
M('mangalam-viro', ['jain', 'daily'], ['Mangalam Bhagwan Viro', 'मंगलं भगवान वीरो'],
'मंगलं भगवान वीरो, मंगलं गौतम प्रभु।\nमंगलं स्थूलिभद्राद्या, जैन धर्मोऽस्तु मंगलम्॥\n\n(दिगंबर परंपरा: मंगलं कुन्दकुन्दार्यो, जैन धर्मोऽस्तु मंगलम्॥)',
['Bhagwan Mahavir is auspicious, Gautam Swami is auspicious, Acharya Sthulibhadra (Digambar: Kundakunda) is auspicious, Jain Dharma is auspicious.', 'भगवान महावीर मंगल हैं, गौतम स्वामी मंगल हैं, आचार्य स्थूलिभद्र (दिगंबर: कुंदकुंद) मंगल हैं, जैन धर्म मंगल है।'],
['Start of any puja, travel or new work', 'हर पूजा, यात्रा या नए काम की शुरुआत में'], 'Mangalam bhagavan viro, mangalam gautama prabhu\nmangalam sthulibhadradya, jaina dharmostu mangalam');
M('darshanam', ['jain'], ['Darshanam Devadevasya', 'दर्शनं देवदेवस्य'],
'दर्शनं देवदेवस्य दर्शनं पापनाशनम्।\nदर्शनं स्वर्गसोपानं दर्शनं मोक्षसाधनम्॥',
['The darshan of the Jina destroys sins; it is a step to heaven and a means to moksha.', 'जिनेन्द्र देव के दर्शन पापों का नाश करते हैं; दर्शन स्वर्ग की सीढ़ी और मोक्ष का साधन है।'],
['On entering the Jain mandir', 'जैन मंदिर में प्रवेश करते समय'], 'Darshanam deva-devasya darshanam papa-nashanam\ndarshanam svarga-sopanam darshanam moksha-sadhanam');
M('bhaktamar', ['jain', 'stuti'], ['Bhaktamar Stotra (verses 1, 2, 26)', 'भक्तामर स्तोत्र (श्लोक 1, 2, 26)'],
'भक्तामर-प्रणत-मौलि-मणि-प्रभाणा-\nमुद्योतकं दलित-पाप-तमो-वितानम्।\nसम्यक् प्रणम्य जिन-पाद-युगं युगादा-\nवालम्बनं भव-जले पततां जनानाम्॥१॥\n\nयः संस्तुतः सकल-वाङ्मय-तत्त्व-बोधा-\nदुद्भूत-बुद्धि-पटुभिः सुर-लोक-नाथैः।\nस्तोत्रैर्जगत्त्रितय-चित्त-हरैरुदारैः\nस्तोष्ये किलाहमपि तं प्रथमं जिनेन्द्रम्॥२॥\n\nतुभ्यं नमस्त्रिभुवनार्तिहराय नाथ,\nतुभ्यं नमः क्षितितलामलभूषणाय।\nतुभ्यं नमस्त्रिजगतः परमेश्वराय,\nतुभ्यं नमो जिन भवोदधिशोषणाय॥२६॥',
['Acharya Mantunga\'s hymn to Bhagwan Rishabhdev (Adinath), loved by both Shwetambar and Digambar Jains. "Salutations to You, O Lord, who removes the pain of the three worlds and dries up the ocean of rebirth."', 'आचार्य मानतुंग का भगवान ऋषभदेव (आदिनाथ) का स्तोत्र, जो श्वेतांबर और दिगंबर दोनों में प्रिय है। "हे नाथ, तीनों लोकों का दुख हरने वाले और भवसागर को सुखाने वाले, आपको नमस्कार।"'],
['Morning; the full stotra has 44/48 verses', 'सुबह; पूरे स्तोत्र में 44/48 श्लोक हैं'], 'Bhaktamara-pranata-mauli-mani-prabhanam\nudyotakam dalita-papa-tamo-vitanam\n...\nTubhyam namas tribhuvanarti-haraya natha ...');
M('uvasaggaharam', ['jain', 'stuti'], ['Uvasaggaharam (verse 1)', 'उवसग्गहरं (पहली गाथा)'],
'उवसग्गहरं पासं, पासं वंदामि कम्म-घण-मुक्कं।\nविसहर-विस-निन्नासं, मंगल-कल्लाण-आवासं॥',
['Attributed to Acharya Bhadrabahu: I bow to Bhagwan Parshvanath, remover of troubles, free from heavy karma, destroyer of snake-poison, home of blessings and welfare.', 'आचार्य भद्रबाहु से जुड़ी स्तुति: संकट हरने वाले, कर्मों से मुक्त, विष का नाश करने वाले, मंगल और कल्याण के धाम भगवान पार्श्वनाथ को वंदन।'],
['Morning, for protection from troubles', 'सुबह, संकटों से रक्षा के लिए'], 'Uvasaggaharam pasam, pasam vandami kamma-ghana-mukkam\nvisahara-visa-ninnasam, mangala-kallana-avasam');
M('shivamastu', ['jain', 'peace'], ['Shivamastu Sarva Jagatah', 'शिवमस्तु सर्व जगतः'],
'शिवमस्तु सर्वजगतः, परहितनिरता भवन्तु भूतगणाः।\nदोषाः प्रयान्तु नाशं, सर्वत्र सुखीभवतु लोकः॥',
['May the whole world be blessed; may all beings work for the good of others; may all faults vanish; may people everywhere be happy.', 'सारे जगत का कल्याण हो, सब प्राणी दूसरों के हित में लगें, सब दोष नष्ट हों, सर्वत्र लोग सुखी हों।'],
['End of puja and pratikraman', 'पूजा और प्रतिक्रमण के अंत में'], 'Shivam astu sarva-jagatah, para-hita-nirata bhavantu bhuta-ganah\ndoshah prayantu nasham, sarvatra sukhi bhavatu lokah');
M('jain-mahavir-mantra', ['jain'], ['Om Hreem Shri Mahavir', 'ॐ ह्रीं श्री महावीर स्वामिने नमः'], 'ॐ ह्रीं श्री महावीर स्वामिने नमः॥',
['Salutations to Bhagwan Mahavir Swami, the 24th Tirthankar.', '24वें तीर्थंकर भगवान महावीर स्वामी को नमन।'], ['108 times, Mahavir Jayanti and daily jaap', '108 बार, महावीर जयंती और रोज़ का जाप'], 'Om hreem shri mahavira svamine namah');

/* --- Sikh --- */
M('aad-sach', ['sikh', 'daily'], ['Aad Sach (Japji Sahib)', 'आदि सचु (जपजी साहिब)'],
'ਆਦਿ ਸਚੁ ਜੁਗਾਦਿ ਸਚੁ ॥\nਹੈ ਭੀ ਸਚੁ ਨਾਨਕ ਹੋਸੀ ਭੀ ਸਚੁ ॥੧॥\n\nआदि सचु जुगादि सचु॥\nहै भी सचु नानक होसी भी सचु॥१॥',
['Guru Nanak Dev Ji, opening of Japji Sahib: True in the beginning, true through the ages, true now, and, says Nanak, forever true.', 'गुरु नानक देव जी, जपजी साहिब का आरंभ: आदि में सच, युगों से सच, अब भी सच, और नानक कहते हैं, आगे भी सच ही रहेगा।'],
['Morning (Amrit vela), after the Mool Mantar', 'सुबह (अमृत वेला), मूल मंत्र के बाद'], 'Aad sach, jugaad sach\nhai bhi sach, Nanak hosi bhi sach');
M('japji-1', ['sikh'], ['Sochai Soch Na Hovai (Japji, Pauri 1)', 'सोचै सोचि न होवई (जपजी, पउड़ी 1)'],
'सोचै सोचि न होवई जे सोची लख वार॥\nचुपै चुप न होवई जे लाइ रहा लिव तार॥\nभुखिआ भुख न उतरी जे बंना पुरीआ भार॥\nसहस सिआणपा लख होहि त इक न चलै नालि॥\nकिव सचिआरा होईऐ किव कूड़ै तुटै पालि॥\nहुकमि रजाई चलणा नानक लिखिआ नालि॥१॥',
['Thinking a lakh times, staying silent or piling up riches does not bring peace; cleverness does not go with us. The way to truth is to walk in God\'s will (Hukam).', 'लाख बार सोचने, चुप रहने या धन जमा करने से शांति नहीं मिलती; चतुराई साथ नहीं जाती। सच का रास्ता है – प्रभु के हुकम में चलना।'],
['Morning, as part of Japji Sahib', 'सुबह, जपजी साहिब के भाग के रूप में'], 'Sochai soch na hovai je sochi lakh vaar ...\nHukam rajai chalna, Nanak likhia naal');
M('gagan-thaal', ['sikh', 'aarti'], ['Gagan Mai Thaal (Sikh Aarti)', 'गगन मै थालु (सिख आरती)'],
'ਗਗਨ ਮੈ ਥਾਲੁ ਰਵਿ ਚੰਦੁ ਦੀਪਕ ਬਨੇ ਤਾਰਿਕਾ ਮੰਡਲ ਜਨਕ ਮੋਤੀ ॥\n\nगगन मै थालु रवि चंदु दीपक बने तारिका मंडल जनक मोती॥\nधूपु मलआनलो पवणु चवरो करे सगल बनराइ फूलंत जोती॥१॥\nकैसी आरती होइ॥ भव खंडना तेरी आरती॥\nअनहता सबद वाजंत भेरी॥१॥ रहाउ॥',
['Guru Nanak Dev Ji\'s aarti, sung at Jagannath Puri: the sky is the plate, the sun and moon are the lamps, the stars are pearls – all of nature performs Your aarti.', 'गुरु नानक देव जी की आरती, जगन्नाथ पुरी में गाई: आकाश थाल है, सूर्य-चंद्र दीपक, तारे मोती – सारी प्रकृति आपकी आरती कर रही है।'],
['Evening, as part of Kirtan Sohila', 'रात को, कीर्तन सोहिला के भाग के रूप में'], 'Gagan mai thaal rav chand deepak bane, taarika mandal janak moti\nDhoop malaanlo pavan chavro kare, sagal banrai phoolant joti\nKaisi aarti hoi, bhav khandna teri aarti');
M('tati-vao', ['sikh', 'peace'], ['Tati Vao Na Lagai (Protection)', 'ताती वाउ न लगई (रक्षा)'],
'ताती वाउ न लगई पारब्रहम सरणाई॥\nचउगिरद हमारै राम कार दुखु लगै न भाई॥१॥',
['Guru Arjan Dev Ji: in the refuge of the Supreme Lord, no hot wind touches me; God has drawn a protective circle around me, so no pain can reach me.', 'गुरु अर्जन देव जी: परब्रह्म की शरण में कोई गर्म हवा नहीं लगती; प्रभु ने चारों ओर रक्षा की रेखा खींची है, कोई दुख नहीं लगता।'],
['For protection and when a child is unwell', 'रक्षा के लिए और जब बच्चा अस्वस्थ हो'], 'Taati vaao na lag-ee paarbrahm sarnaa-ee\nChaugird hamaarai raam kaar dukh lagai na bhaa-ee');
M('deh-shiva', ['sikh', 'stuti'], ['Deh Shiva Bar Mohe Ehai', 'देह सिवा बरु मोहि इहै'],
'देह सिवा बरु मोहि इहै सुभ करमन ते कबहूं न टरों॥\nन डरों अरि सों जब जाइ लरों निसचै करि अपुनी जीत करों॥\nअरु सिख हों आपने ही मन कौ इह लालच हउ गुन तउ उचरों॥\nजब आव की अउध निदान बनै अति ही रन मै तब जूझ मरों॥',
['Guru Gobind Singh Ji\'s prayer: grant me this boon, O Lord, that I never turn away from good deeds, never fear when I face the enemy, and win with certainty.', 'गुरु गोबिंद सिंह जी की प्रार्थना: हे प्रभु, मुझे यह वर दो कि मैं शुभ कर्मों से कभी न हटूँ, शत्रु से लड़ते समय न डरूँ और निश्चय से विजय पाऊँ।'],
['For courage, anytime', 'साहस के लिए, कभी भी'], 'Deh shiva bar mohe ehai, shubh karman te kabhoon na taron\nNa daron ar so jab jaye laron, nischai kar apuni jeet karon');
M('sarbat-bhala', ['sikh', 'peace'], ['Nanak Naam Chardi Kala', 'नानक नाम चढ़दी कला'],
'नानक नाम चढ़दी कला, तेरे भाणे सरबत दा भला॥\n\nवाहिगुरु जी का खालसा, वाहिगुरु जी की फ़तेह॥',
['The closing line of the Ardas: through Nanak and the Name may our spirits always rise, and by Your will may there be good for all (Sarbat da Bhala).', 'अरदास की अंतिम पंक्ति: नानक के नाम से हमारा मन सदा चढ़दी कला में रहे, और आपके भाणे में सबका भला हो।'],
['End of Ardas, morning and evening', 'अरदास के अंत में, सुबह और शाम'], 'Nanak naam chardi kala, tere bhaane sarbat da bhala\nWaheguru ji ka Khalsa, Waheguru ji ki Fateh');

/* --- Buddhist --- */
M('namo-tassa', ['buddh', 'daily'], ['Namo Tassa (Homage to the Buddha)', 'नमो तस्स (बुद्ध वंदना)'],
'नमो तस्स भगवतो अरहतो सम्मासम्बुद्धस्स॥ (३ बार)',
['Homage to the Blessed One, the Worthy One, the fully Enlightened Buddha. Said three times at the start of every Buddhist prayer.', 'उन भगवान, अर्हत, सम्यक् संबुद्ध को नमस्कार। हर बौद्ध वंदना की शुरुआत में तीन बार बोला जाता है।'],
['Start of meditation or prayer', 'ध्यान या वंदना की शुरुआत में'], 'Namo tassa bhagavato arahato samma-sambuddhassa (3 times)');
M('tisarana', ['buddh', 'daily'], ['Tisarana (Three Refuges)', 'तिसरण (त्रिशरण)'],
'बुद्धं सरणं गच्छामि।\nधम्मं सरणं गच्छामि।\nसंघं सरणं गच्छामि॥',
['I go to the Buddha for refuge, I go to the Dhamma for refuge, I go to the Sangha for refuge.', 'मैं बुद्ध की शरण जाता हूँ, धम्म की शरण जाता हूँ, संघ की शरण जाता हूँ।'],
['Daily, Buddha Purnima', 'रोज़, बुद्ध पूर्णिमा'], 'Buddham saranam gacchami\nDhammam saranam gacchami\nSangham saranam gacchami');
M('metta', ['buddh', 'peace'], ['Metta (Loving-kindness)', 'मेत्ता (मैत्री भावना)'],
'सब्बे सत्ता भवन्तु सुखितत्ता।\nसब्बे सत्ता अवेरा होन्तु।\nभवतु सब्ब मंगलं॥',
['May all beings be happy; may all beings be free from hatred; may all be blessed.', 'सब प्राणी सुखी हों; सब प्राणी वैर से मुक्त हों; सबका मंगल हो।'],

  function prediction(p, off) {
    const ch = chartOf(p), dt = todayYMD(off);
    const dy = E.daily({ moonSign: ch.moonSign, moonNak: ch.moonNak, key: p.id }, dt.y, dt.m, dt.d, p.tz || 5.5);

    // ---- many factors, like an astrologer would weigh them ----
    const jdNoon = E.jdFromLocal(dt.y, dt.m, dt.d, 12, 0, 5.5), tr = E.sidereal(jdNoon);
    const fromMoon = lon => ((Math.floor(lon / 30) - ch.moonSign + 12) % 12) + 1;
    const jh = fromMoon(tr.Jupiter), sh = fromMoon(tr.Saturn);
    const why = [];
    const add = (v, key, n) => why.push({ v, key, n });
    if ([2, 5, 7, 9, 11].includes(jh)) add(0.4, 'guruGood', jh); else if ([3, 6, 8, 12].includes(jh)) add(-0.2, 'guruWeak', jh);
    if ([12, 1, 2].includes(sh)) add(-0.4, 'sadeSati', sh); else if ([4, 8].includes(sh)) add(-0.3, 'dhaiya', sh); else if ([3, 6, 11].includes(sh)) add(0.3, 'shaniGood', sh);
    const md = ch.dasha.find(x => x.start <= jdNoon && x.end > jdNoon) || ch.dasha[0], ad = md.sub.find(x => x.start <= jdNoon && x.end > jdNoon) || md.sub[0];
    const adS = planetStrength(ch.planets.find(x => x.name === ad.lord));
    if (adS >= 1) add(0.3, 'dashaGood', ad.lord); else if (adS <= -1) add(-0.3, 'dashaWeak', ad.lord);
    const tt = E.dayPanchang(dt.y, dt.m, dt.d, 22.0, 78.0, 5.5).tithi;
    if (tt === 29) add(-0.3, 'amavasya'); else if (tt === 14) add(0.2, 'purnima'); else if (tt === 10 || tt === 25) add(0.2, 'ekadashi'); else if ([3, 8, 13, 18, 23, 28].includes(tt)) add(-0.2, 'rikta');
    const wdRel = E.rel(E.SIGN_LORD[ch.moonSign], C.wdLord[dy.wd]);
    const base = C.houseBase[dy.house - 1] + C.taraMod[dy.tara] + (wdRel === 'f' ? 0.15 : wdRel === 'e' ? -0.15 : 0);
    let score = Math.max(1, Math.min(5, Math.round(base + why.reduce((a, b) => a + b.v, 0))));
    if (dy.house === 8) score = Math.min(score, 2);   // Chandrashtama always calls for care
    const natal = (() => { const R = lifeReading(ch, jdNoon); return ['career', 'money', 'health', 'family'].map(k => R.areas.find(a => a.k === k).stars); })();
    const areas = C.areaMod[dy.house - 1].map((mod, i) => {
      const noise = (((seed >>> (i * 3)) & 7) - 3.5) / 14;
      return Math.max(1, Math.min(5, Math.round(score + mod + (natal[i] - 3) * 0.35 + noise)));
    });
    why.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
    const moonLord = E.SIGN_LORD[ch.moonSign], wdLord = C.wdLord[dy.wd];
    const luckyP = E.rel(moonLord, wdLord) !== 'e' ? wdLord : moonLord;
    const enemies = E.FRIENDS[moonLord].e.filter(x => C.colour[x][0] !== C.colour[luckyP][0]);
    const avoidP = enemies.length ? enemies[seed % enemies.length] : 'Rahu';
    const droot = n => { while (n > 9) n = String(n).split('').reduce((a, b) => a + +b, 0); return n || 9; };
    const luckyNum = droot(droot(p.d) + C.wdNum[dy.wd] + (seed % 3));
    const badTara = C.taraMod[dy.tara] < 0;
    const dos = [C.houseDo[dy.house - 1], C.wdDo[dy.wd], C.genDo[seed % C.genDo.length]];
    const donts = [C.houseDont[dy.house - 1], C.wdDont[dy.wd], badTara ? C.badTaraDont : C.genDont[(seed >>> 4) % C.genDont.length]];
    const pl = place();
    const pc = E.dayPanchang(dt.y, dt.m, dt.d, pl.lat, pl.lon, pl.tz);
    return { why: why.slice(0, 3), dt, dy, score, areas, lucky: C.colour[luckyP], avoid: C.colour[avoidP], luckyNum, luckyDir: C.luckyDir[C.wdLord.indexOf(wdLord)], avoidDir: C.avoidDir[dy.wd], dos, donts, pc, pl, ch, mantra: C.mantra[dy.wd] };
  }

  function chartSVG(ch, mode) {

  /* ---------- Life reading from the birth chart ---------- */
  function planetStrength(x) {
    if (!x) return 0;
    const DIG = { ex: 2, own: 1.5, friend: 0.5, neutral: 0, enemy: -0.5, deb: -2 }, DIG9 = { ex: 1, own: 0.75, friend: 0.25, neutral: 0, enemy: -0.25, deb: -1 };
    if (!x.dignity) return [6, 8, 12].includes(x.house) ? -0.5 : 0;
    let v = DIG[x.dignity] + (DIG9[x.d9dignity] || 0) + (x.vargottama ? 0.75 : 0) - (x.combust ? 1.5 : 0);
    if ([1, 4, 5, 7, 9, 10].includes(x.house)) v += 0.5; else if ([6, 8, 12].includes(x.house)) v -= 1;
    return v;
  }
  const EXALT = { Sun: 0, Moon: 1, Mars: 9, Mercury: 5, Jupiter: 3, Venus: 11, Saturn: 6 };
  const BENEFIC = ['Jupiter', 'Venus', 'Mercury', 'Moon'];
  function dignity(pl) {
    if (!(pl.name in EXALT)) return null;
    if (pl.sign === EXALT[pl.name]) return 'ex';
    if (pl.sign === (EXALT[pl.name] + 6) % 12) return 'deb';
    if (E.SIGN_LORD[pl.sign] === pl.name) return 'own';
    return null;
  }
  function lifeReading(ch, now) {
    const BENEFIC = ['Jupiter', 'Venus', 'Mercury', 'Moon'];
    const P = n => ch.planets.find(x => x.name === n);
    const lordOf = h => E.SIGN_LORD[(ch.lagnaSign + h - 1) % 12];
    // planet strength: sign dignity, Navamsa (D9), vargottama, combustion, house placement
    const DIG = { ex: 2, own: 1.5, friend: 0.5, neutral: 0, enemy: -0.5, deb: -2 }, DIG9 = { ex: 1, own: 0.75, friend: 0.25, neutral: 0, enemy: -0.25, deb: -1 };
    const strength = x => {
      if (!x.dignity) return [1, 4, 5, 7, 9, 10].includes(x.house) ? 0 : [6, 8, 12].includes(x.house) ? -0.5 : 0; // Rahu / Ketu
      let v = DIG[x.dignity] + (DIG9[x.d9dignity] || 0) + (x.vargottama ? 0.75 : 0) - (x.combust ? 1.5 : 0);
      if ([1, 4, 5, 7, 9, 10].includes(x.house)) v += 0.5; else if ([6, 8, 12].includes(x.house)) v -= 1;
      return v;
    };
    const UPA = [3, 6, 10, 11];
    const houseScore = h => {
      let s = 3; const L = P(lordOf(h));
      s += Math.max(-1.5, Math.min(1.5, strength(L) * 0.5));
      ch.planets.filter(x => x.house === h).forEach(x => {
        if (BENEFIC.includes(x.name)) s += (x.dignity === 'deb' || x.combust) ? 0 : 0.5; else s += UPA.includes(h) ? 0.5 : -0.5;
      });
      ch.planets.filter(x => x.house !== h && x.aspects.includes(h)).forEach(x => {   // drishti (aspects) on the house
        if (x.name === 'Jupiter') s += 0.6; else if (x.name === 'Venus' || x.name === 'Mercury') s += 0.3;
        else if (['Saturn', 'Mars', 'Rahu'].includes(x.name)) s += UPA.includes(h) ? 0.2 : -0.4;
      });
      return s;
    };
    const periodFor = lords => {
      for (const md of ch.dasha) for (const ad of md.sub) {
        if (ad.end <= now || ad.start > now + 25 * 365.25) continue;
        if (lords.includes(ad.lord) || (lords.includes(md.lord) && ad.lord === md.lord)) return { start: Math.max(ad.start, now), end: ad.end, lord: ad.lord, md: md.lord, now: ad.start <= now };
      }
      return null;
    };
    const areas = C.life.areas.map(a => {
      let s = a.h.reduce((x, h) => x + houseScore(h), 0) / a.h.length;
      const karaka = a.kar ? P(a.kar) : P(lordOf(1));
      s += Math.max(-1, Math.min(1, strength(karaka) * 0.3));
      if (a.k === 'love') { const l7 = P(lordOf(7)), v = P('Venus'); s += ((DIG9[l7.d9dignity] || 0) + (DIG9[v.d9dignity] || 0)) * 0.4; }   // marriage: Navamsa
      if (a.k === 'career') { const l10 = P(lordOf(10)); s += (DIG9[l10.d9dignity] || 0) * 0.4; }
      const stars = Math.max(1, Math.min(5, Math.round(s)));
      const lvl = stars >= 4 ? 's' : stars >= 3 ? 'a' : 'w';
      const mainHouse = a.h[a.h.length - 1], lord = lordOf(mainHouse);
      const occ = ch.planets.filter(x => a.h.includes(x.house)).map(x => {
        const dg = dignity(x);
        const kind = dg === 'deb' ? 'slow' : BENEFIC.includes(x.name) ? 'good' : [3, 6, 10, 11].includes(x.house) ? 'push' : 'slow';
        return pick(C.life.inHouse[kind]).replace('{p}', pName(x.name) + (dg ? ` (${pick(C.life.dignity[dg])})` : ''));
      });
      const lords = [...new Set(a.h.map(lordOf).concat(a.kar ? [a.kar] : []))];
      return { ...a, stars, lvl, lord, occ, period: periodFor(lords) };
    });
    // yogas
    const yogas = [];
    const sun = P('Sun'), moon = P('Moon'), mars = P('Mars'), merc = P('Mercury'), jup = P('Jupiter');
    if ([0, 3, 6, 9].includes((jup.sign - moon.sign + 12) % 12)) yogas.push('gaja');
    if (sun.sign === merc.sign) yogas.push('budh');
    if (moon.sign === mars.sign) yogas.push('chandramangal');
    const sameSign = (a, b) => a !== b && P(a).sign === P(b).sign;
    const kL = [4, 7, 10].map(lordOf), tL = [1, 5, 9].map(lordOf);
    if (kL.some(k => tL.some(x => sameSign(k, x))) || [5, 9].map(lordOf).some(l => [1, 4, 7, 10].includes(P(l).house) && P(l).sign === P(lordOf(1)).sign)) yogas.push('raj');
    const l2 = lordOf(2), l11 = lordOf(11);
    if (sameSign(l2, l11) || P(l2).house === 11 || P(l11).house === 2) yogas.push('dhana');
    ['Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].forEach(n => { const x = P(n), d = dignity(x); if ((d === 'ex' || d === 'own') && [1, 4, 7, 10].includes(x.house)) yogas.push(n); });
    // weakest planet for remedy
    const weak = ch.planets.filter(x => dignity(x) === 'deb').map(x => x.name)
      .concat([lordOf(1), lordOf(10), lordOf(7)].filter(n => [6, 8, 12].includes(P(n).house)))
      .concat(ch.planets.filter(x => x.house === 8 && x.name !== 'Ketu').map(x => x.name));
    const remedies = [...new Set(weak)].slice(0, 3);
    if (!remedies.length) remedies.push(lordOf(1));
    return { areas, yogas, remedies, lagnaLord: lordOf(1) };
  }

  function screenMatch() {
    const boys = S.profiles.filter(p => p.gender === 'm'), girls = S.profiles.filter(p => p.gender === 'f');
    let body;
    if (!boys.length || !girls.length) body = `<section class="card"><p>${t('needTwo')}</p><button class="btn primary block" data-a="addMember">${t('addMember')}</button></section>`;
    else {
      const opt = (arr, sel) => arr.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
      const bSel = V.matchBoy || boys[0].id, gSel = V.matchGirl || girls[0].id;
      body = `<section class="card"><label class="fl">${t('boy')}<select id="mBoy">${opt(boys, bSel)}</select></label>
        <label class="fl">${t('girl')}<select id="mGirl">${opt(girls, gSel)}</select></label>
        <button class="btn primary block" data-a="runMatch">${t('checkMatch')}</button></section>`;
      if (V.matchRes) {
        const r = V.matchRes, tot = r.total;
        const v = tot < 18 ? 'v1' : tot < 25 ? 'v2' : tot < 33 ? 'v3' : 'v4';
        const cls = tot < 18 ? 'bad' : tot < 25 ? 'mid' : 'good';
        const C0 = 2 * Math.PI * 52, off = C0 * (1 - tot / 36);
        body += `<section class="card center"><div class="ring ${cls}"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rt"/><circle cx="60" cy="60" r="52" class="rp" style="stroke-dasharray:${C0};stroke-dashoffset:${off};--c0:${C0}"/></svg><b data-count="${tot}">0</b><span>${t('outOf36')}</span></div>
          <div class="kv">${t('gunas')}</div><p class="lead">${t(v)}</p>
          ${r.rows.find(x => x.k === 'nadi').s === 0 ? `<div class="pill ${r.nadiCancel ? 'good' : 'bad'}">${t('nadiDosh')}${r.nadiCancel ? ' · ' + pick(C.acc.cancelled) : ''}</div>` : ''}
          ${r.rows.find(x => x.k === 'bhakoot').s === 0 ? `<div class="pill ${r.bhakootCancel ? 'good' : 'bad'}">${t('bhakootDosh')}${r.bhakootCancel ? ' · ' + pick(C.acc.cancelled) : ''}</div>` : ''}
          ${r.nadiCancel || r.bhakootCancel ? `<p class="muted small">${pick(C.acc.doshCancelNote)}</p>` : ''}</section>
          <section class="card"><table class="tbl"><thead><tr><th>Koota</th><th></th><th>${t('score')}</th></tr></thead><tbody>
          ${r.rows.map(x => { const k = C.koota[x.k]; return `<tr><td><b>${k[L()]}</b></td><td class="muted small">${k[2 + L()]}</td><td><b>${x.s}</b>/${x.max}</td></tr>`; }).join('')}
          </tbody></table></section>
          <section class="card"><h3>${t('manglik')}</h3>
          ${[r.boy, r.girl].map(p => { const c = chartOf(p), m = c.manglik.fromLagna || c.manglik.fromMoon, cx = m && c.manglik.cancelled; return `<div class="area"><span>${esc(p.name)}</span><b class="${m && !cx ? 'tbad' : 'tgood'}">${m ? (cx ? pick(C.acc.mCancelled) : t('isManglik')) : t('notManglik')}</b></div>`; }).join('')}
          ${r.manglikBoth ? `<p class="small">✅ ${pick(C.acc.mBoth)}</p>` : r.manglikOne ? `<p class="small">⚠️ ${pick(C.acc.mOne)}</p>` : ''}
          </section>
          ${compatHTML()}`;
      }
    }
    return `${V.tab === 'kundli' ? `<button class="btn link" data-a="closeMatch">${ICON.left}${t('back')}</button>` : ''}<h2 class="ptitle">💞 ${t('match')}</h2>${body}`;

  function screenPanchang() {
    const pl = place(); const base = V.pDate || todayYMD();

    const tz = pl.tz, tIdx = pc.tithi, shukla = tIdx < 15;
    const tName = tIdx === 14 ? C.tithi[14] : tIdx === 29 ? C.tithi[15] : C.tithi[tIdx % 15];
    const sp = E.specialDays(base.y, base.m, base.d, pl.lat, pl.lon, pl.tz, 45).slice(0, 8);
    const row = (k, v, sub) => `<div class="prow"><span>${k}</span><b>${v}${sub ? `<small>${sub}</small>` : ''}</b></div>`;
    const cityOpts = C.cities.map((c, i) => `<option value="${i}" ${S.homeCity === i ? 'selected' : ''}>${pick([c[0], c[1]])}</option>`).join('');
    return `<h2 class="ptitle">📅 ${t('panchang')}</h2>
      <label class="fl">${t('city')}<select id="homeCity"><option value="">${esc(active().place)}</option>${cityOpts}</select></label>

        ${row(t('tithi'), pick(tName), `${t('till')} ${fmtTime(pc.tithiEnd, tz)}`)}
        ${row(t('paksha'), shukla ? t('shukla') : t('krishna'))}
        ${row(t('nakshatra'), pick(C.nak[pc.nak]), `${t('till')} ${fmtTime(pc.nakEnd, tz)}`)}
        ${row(t('yoga'), pick(C.yoga[pc.yoga]), `${t('till')} ${fmtTime(pc.yogaEnd, tz)}`)}
        ${row(t('karana'), pick(C.karana[pc.karana]))}
        ${row(t('vaar'), pick(C.wd[pc.wd]))}
        ${row(t('moonSign'), pick(C.rashiShort[pc.moonSign]))}
      </section>
      <section class="card"><h3>${t('timings')}</h3>
        <div class="time"><span>☀️ ${t('sunrise')}</span><b>${fmtTime(pc.sunrise, tz)}</b></div>
        <div class="time"><span>🌇 ${t('sunset')}</span><b>${fmtTime(pc.sunset, tz)}</b></div>

        <div class="time bad"><span>${t('yama')}</span><b>${fmtTime(pc.yama.start, tz)} – ${fmtTime(pc.yama.end, tz)}</b></div>
        <div class="time bad"><span>${t('gulika')}</span><b>${fmtTime(pc.gulika.start, tz)} – ${fmtTime(pc.gulika.end, tz)}</b></div>
      </section>
      <section class="card"><h3>${t('upcoming')}</h3>${sp.map(s => `<div class="sday"><div class="sdate"><b>${s.d}</b><span>${pick(C.months[s.m - 1]).slice(0, L() ? 10 : 3)}</span></div><div><b>${pick(C.special[s.type])}</b><div class="muted small">${pick(C.wd[s.wd])}</div></div></div>`).join('')}</section>`;

  function sadeSati(ch) {
    const now = jdNow(), segs = [];
    for (let jd = now - 12 * 365.25; jd < now + 35 * 365.25; jd += 15) {
      const s = Math.floor(E.sidereal(jd).Saturn / 30), h = ((s - ch.moonSign + 12) % 12) + 1;
      const type = [12, 1, 2].includes(h) ? 'sade' : [4, 8].includes(h) ? 'dhaiya' : null;
      const last = segs[segs.length - 1];
      if (last && last.type === type) last.end = jd + 15;
      else segs.push({ type, start: jd, end: jd + 15 });
    }
    const real = segs.filter(x => x.type);
    const merged = [];
    real.forEach(x => { const l = merged[merged.length - 1]; if (l && l.type === x.type && x.start - l.end < 320) l.end = x.end; else merged.push({ ...x }); });
    const cur = merged.find(x => x.start <= now && x.end > now) || null;
    return { cur, nextSade: merged.find(x => x.type === 'sade' && x.start > now), nextDhaiya: merged.find(x => x.type === 'dhaiya' && x.start > now) };
  }

  function yearAhead(ch) {
    const now = jdNow(), out = { Jupiter: [], Saturn: [] };
    for (let m = 0; m < 12; m++) {
      const jd = now + m * 30.44, sp = E.sidereal(jd);
      ['Jupiter', 'Saturn'].forEach(n => {
        const h = ((Math.floor(sp[n] / 30) - ch.moonSign + 12) % 12) + 1, arr = out[n], l = arr[arr.length - 1];
        if (l && l.h === h) l.end = jd + 30.44; else arr.push({ h, start: jd, end: jd + 30.44 });
      });
    }
    const good = { Jupiter: [2, 5, 7, 9, 11], Saturn: [3, 6, 11] };
    const txt = (n, s) => pick(good[n].includes(s.h) ? P_.transGood : P_.transSlow).replace('{p}', n === 'Jupiter' ? pick(P_.guru) : pick(P_.shani)).replace('{n}', pick(P_.ord[s.h - 1])).replace('{t}', pick(P_.themes[s.h - 1]));
    return ['Jupiter', 'Saturn'].map(n => ({ n, rows: out[n].map(s => ({ ...s, good: good[n].includes(s.h), text: txt(n, s) })) }));
  }

  function shrinkImage(dataUrl, max = 1100) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82)); };
      im.onerror = () => res(dataUrl); im.src = dataUrl;
    });
  }
  async function setHand(hand, dataUrl) { PV[hand] = await shrinkImage(dataUrl, 1400); PV.bad[hand] = false; PV.err = ''; PV.q[hand] = await photoQuality(PV[hand]); render(); }
  // quick on-phone photo check: too dark, too bright or blurry photos give poor readings
  function photoQuality(dataUrl) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const w = 256, h = Math.round(256 * im.height / im.width), c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0, w, h); const d = g.getImageData(0, 0, w, h).data, gray = new Float32Array(w * h);
        let sum = 0; for (let i = 0; i < w * h; i++) { const v = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; gray[i] = v; sum += v; }
        const mean = sum / (w * h); let lap = 0, lap2 = 0, n = 0;
        for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x, v = 4 * gray[i] - gray[i - 1] - gray[i + 1] - gray[i - w] - gray[i + w]; lap += v; lap2 += v * v; n++; }
        const variance = lap2 / n - (lap / n) ** 2;
        res({ dark: mean < 60, bright: mean > 232, blurry: variance < 20, mean: Math.round(mean), sharp: Math.round(variance) });
      };
      im.onerror = () => res({}); im.src = dataUrl;
    });
  }

  function sunPos(date, lat, lon) {   // NOAA low-precision solar position: azimuth (from North, clockwise) and altitude
    const rad = Math.PI / 180, jd = date.getTime() / 86400000 + 2440587.5, n = jd - 2451545;
    const L0 = (280.46 + 0.9856474 * n) % 360, g = (357.528 + 0.9856003 * n) % 360 * rad;
    const lam = (L0 + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const gmst = (280.46061837 + 360.98564736629 * n) % 360, H = (gmst + lon) * rad - ra, la = lat * rad;
    const alt = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(H));
    const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(H));
    return { az: (az / rad + 360) % 360, alt: alt / rad };

  async function startCompass() {
